networks:
  reporting-net:
    driver: bridge

volumes:
  solr_data:
  mysql_data:
  redis_data:
  kafka_data:

services:

  # Kafka (KRaft mode - no Zookeeper needed, uses official apache/kafka image)
  kafka:
    image: apache/kafka:3.7.1
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - reporting-net

  solr:
    image: solr:9
    container_name: solr
    ports:
      - "8983:8983"
    volumes:
      - solr_data:/var/solr
      - ./solr/configsets/report_schema:/opt/solr/server/solr/configsets/report_schema
    command: solr-precreate report_data /opt/solr/server/solr/configsets/report_schema
    networks:
      - reporting-net

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - reporting-net

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3316:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - reporting-net

  php-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: php-backend
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    env_file:
      - .env
    depends_on:
      - mysql
      - solr
      - redis
      - kafka
    networks:
      - reporting-net

  kafka-producer:
    build:
      context: ./kafka/producer
      dockerfile: Dockerfile
    container_name: kafka-producer
    volumes:
      - ./kafka/producer:/app
      - ./kafka/producer/data:/app/data
    env_file:
      - .env
    depends_on:
      - kafka
    networks:
      - reporting-net

  kafka-consumer:
    build:
      context: ./kafka/consumer
      dockerfile: Dockerfile
    container_name: kafka-consumer
    volumes:
      - ./kafka/consumer:/app
    env_file:
      - .env
    depends_on:
      - kafka
      - solr
    networks:
      - reporting-net
    restart: unless-stopped

  react-frontend:
    image: node:20-alpine
    container_name: react-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    env_file:
      - .env
    depends_on:
      - php-backend
    networks:
      - reporting-net

  realtime-server:
    image: node:20-alpine
    container_name: realtime-server
    working_dir: /app
    volumes:
      - ./realtime:/app
    ports:
      - "3001:3001"
    command: sh -c "npm install && npm run start"
    env_file:
      - .env
    networks:
      - reporting-net
